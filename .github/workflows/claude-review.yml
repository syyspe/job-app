name: Claude PR review

# Stage 4 (Ship): runs the review passes defined in REVIEW.md on every PR,
# and lets authors request fixes by tagging @claude on a review comment.
#
# Requires an ANTHROPIC_API_KEY secret (Settings → Secrets and variables →
# Actions). See https://github.com/anthropics/claude-code-action for the
# action's full configuration surface.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Full review on new/updated PRs; targeted response when someone tags
    # @claude on a comment (REVIEW.md's "response loop").
    #
    # The comment path is gated hard, because on a public repo anyone with a
    # GitHub account can write "@claude" anywhere — and unlike `pull_request`
    # from a fork, `issue_comment` runs in the base-branch context with this
    # workflow's secrets and write permissions. So: comments on pull requests
    # only (not plain issues), and only from someone who already has write
    # access here.
    if: >
      github.event_name == 'pull_request' ||
      ((github.event_name == 'pull_request_review_comment' ||
        github.event.issue.pull_request != null) &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Secrets can't be referenced from a step-level `if:`, so turn the
      # presence of the key into an output the review step can gate on.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Claude PR review skipped"
              echo
              echo "No \`ANTHROPIC_API_KEY\` secret is set. Add one under"
              echo "**Settings → Secrets and variables → Actions** to turn"
              echo "automated review on. Until then, run \`/review\`"
              echo "locally — it runs \`REVIEW.md\`'s passes against this PR."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Point the action at this repo's review policy rather than a
          # generic prompt — REVIEW.md defines passes, severity, and the
          # nit cap.
          prompt: |
            Review this pull request following the policy in REVIEW.md at
            the root of this repo: run all four passes in that order (Bugs,
            Security, Compliance, Simplicity), rank findings Important vs.
            Nit, respect the nit cap, and skip the excluded paths it lists.
            If a plans/*.plan.md exists for this branch, check the diff
            against it as part of the Compliance pass.
